name: Daily Threads Post
on:
  # 定时由 cron-job.org 每 30 分钟触发（GitHub 自己的 schedule 会跳过，还会跟外部触发撞车）
  workflow_dispatch:       # 手动或外部定时服务触发
    inputs:
      force:
        description: "不管节奏规则，立刻发一串"
        type: boolean
        default: false
permissions:
  contents: write
concurrency:               # 两次运行不会同时进行，避免重复发同一条
  group: threads-post
  cancel-in-progress: false
jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests
      - name: 先拉最新纪录，避免跟另一次运行撞车
        run: |
          git fetch origin "$GITHUB_REF_NAME"
          git reset --hard "origin/$GITHUB_REF_NAME"
      - name: 发布
        run: python 工具/post.py
        env:
          THREADS_TOKEN: ${{ secrets.THREADS_TOKEN }}
          IG_TOKEN: ${{ secrets.IG_TOKEN }}
          GATE: ${{ inputs.force && '0' || '1' }}
      - name: 记录已发并提交（拉最新队列再改，失败自动重试）
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          for i in 1 2 3 4 5; do
            git fetch origin "$GITHUB_REF_NAME"
            git reset --hard "origin/$GITHUB_REF_NAME"
            python 工具/post.py record
            git add -A
            git diff --cached --quiet && exit 0
            git commit -m "posted $(date -u '+%F %H:%M')"
            git push && exit 0
            sleep 5
          done
          echo "已发布但记录没提交成功，请检查"; exit 1
