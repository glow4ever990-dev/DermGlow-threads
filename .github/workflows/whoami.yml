name: 查帳號
on:
  workflow_dispatch:
jobs:
  whoami:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests
      - name: 查目前在用哪個帳號
        env:
          THREADS_TOKEN: ${{ secrets.THREADS_TOKEN }}
          IG_TOKEN: ${{ secrets.IG_TOKEN }}
        run: |
          python - <<'PY'
          import os, requests
          t = os.environ.get("THREADS_TOKEN")
          if t:
              r = requests.get("https://graph.threads.net/v1.0/me",
                               params={"fields": "id,username,name", "access_token": t}, timeout=30)
              print("Threads 帳號：", r.json() if r.ok else r.text[:200])
          i = os.environ.get("IG_TOKEN")
          if i:
              r = requests.get("https://graph.instagram.com/v21.0/me",
                               params={"fields": "user_id,username,account_type", "access_token": i}, timeout=30)
              print("Instagram 帳號：", r.json() if r.ok else r.text[:200])
          else:
              print("Instagram：還沒設 IG_TOKEN")
          PY
