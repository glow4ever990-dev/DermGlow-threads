name: Refresh Threads Token
on:
  schedule:
    - cron: "0 2 1,15 * *"   # 每月 1 号和 15 号刷新（token 60 天过期）
  workflow_dispatch:
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: 刷新并写回 secret
        env:
          OLD: ${{ secrets.THREADS_TOKEN }}
          GH_TOKEN: ${{ secrets.GH_PAT }}
        run: |
          NEW=$(curl -s "https://graph.threads.net/refresh_access_token?grant_type=th_refresh_token&access_token=$OLD" | jq -r .access_token)
          if [ -z "$NEW" ] || [ "$NEW" = "null" ]; then echo "刷新失败"; exit 1; fi
          gh secret set THREADS_TOKEN --body "$NEW" --repo "$GITHUB_REPOSITORY"
